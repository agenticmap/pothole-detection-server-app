services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: pothole-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pothole
      POSTGRES_PASSWORD: pothole
      POSTGRES_DB: pothole_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pothole -d pothole_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
